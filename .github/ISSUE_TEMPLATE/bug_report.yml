name: Bug report
description: Something in the skills pack is wrong or confusing
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, use [private advisories](https://github.com/Gabriel-Lafrance/Skills/security/advisories/new) instead.
  - type: input
    id: skill
    attributes:
      label: Skill or file
      description: e.g. `/goal`, `skills/taste/doctrine.md`
      placeholder: /taste
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected vs actual behavior when using the skill
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the pack…
        2. Run /…
        3. …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Cursor version, OS, global vs project install, skills version if known
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, or links
    validations:
      required: false
