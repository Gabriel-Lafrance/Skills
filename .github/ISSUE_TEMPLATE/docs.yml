name: Docs or how-to fix
description: README, how-to, templates, or install instructions need a fix
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: path
    attributes:
      label: File or page
      placeholder: README.md / how-to.md / .github/…
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or unclear
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
    validations:
      required: false
